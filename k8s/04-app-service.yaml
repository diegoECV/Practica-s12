apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: practica-s12
  labels:
    app: secure-app
    session: s12
  annotations:
    # Anotaciones para provisión automática en AWS ELB / NLB
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: secure-app
  ports:
    - name: http
      protocol: TCP
      port: 80         # Puerto público expuesto por el LoadBalancer
      targetPort: 3000 # Puerto del contenedor (secure-app)
      nodePort: 31080  # Puerto NodePort utilizable directamente en VPC o Minikube

